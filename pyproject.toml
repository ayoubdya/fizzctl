[project]
name = "fizzctl"
version = "0.2.0"
description = "Linux tooling for the Redragon K617 Fizz: RGB effects, per-key painting, keymap, Cfg.ini parser"
readme = "README.md"
authors = [
    { name = "microgod", email = "ayoubdya@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dpkt>=1.9.8",
    "hidapi>=0.15.0",
]

[project.scripts]
fizzctl = "fizzctl:main"
fizzctl-dev = "fizzctl:main_dev"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
