[project]
name = "k617-ctrl"
version = "0.1.0"
description = "Linux tooling for the Redragon K617 Fizz: Cfg.ini parser, keymap restore, per-key RGB"
readme = "README.md"
authors = [
    { name = "microgod", email = "ayoubdya@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dpkt>=1.9.8",
    "hidapi>=0.15.0",
]

[project.scripts]
k617-ctrl = "k617_ctrl:main"
k617-ctrl-dev = "k617_ctrl:main_dev"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
