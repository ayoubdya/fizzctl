[project]
name = "fizzctl"
version = "0.2.0"
description = "Linux tooling for the Redragon K617 Fizz: RGB effects, per-key painting, keymap, Cfg.ini parser"
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [
    { name = "microgod", email = "ayoubdya@gmail.com" }
]
keywords = [
    "redragon",
    "k617",
    "fizz",
    "rgb",
    "keyboard",
    "backlight",
    "led",
    "hid",
    "linux",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.14"
dependencies = [
    "dpkt>=1.9.8",
    "hidapi>=0.15.0",
]

[project.scripts]
fizzctl = "fizzctl:main"
fizzctl-dev = "fizzctl:main_dev"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
